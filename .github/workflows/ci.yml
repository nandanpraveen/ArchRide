name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.2"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm transit:edge:build
      - run: pnpm push:build
      - run: git diff --exit-code -- supabase/functions/push-reminders/core.js
      - run: git diff --exit-code -- supabase/functions/transit-ingest/core.js supabase/functions/predictor-update/core.js supabase/functions/predictor-update/dataset.js
      - run: pnpm test:transit
      - run: pnpm test:classes
      - run: pnpm test:notifications
      - run: deno test --allow-env --config supabase/functions/push-reminders/deno.json supabase/functions/push-reminders/runtime.test.ts
      - run: pnpm test:planner
      - run: pnpm test:personal
      - run: pnpm test:parking
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build:pages
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec playwright test --config playwright.export.config.ts --grep-invert "real signed-in account"
